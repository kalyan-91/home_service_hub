{% extends "base.html" %}

{% block title %}Select an appliance{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Select an appliance</h1>
  <p>Pick the home and appliance this service is for, or skip if it doesn't apply.</p>
</section>

<div id="appliance-message" class="alert" role="status" hidden></div>

<div id="appliance-step" data-service-id="{{ request.args.get('service_id', '') }}">

  <div class="form-group">
    <label for="home-select">Home</label>
    <select id="home-select"><option value="">Loading your homes…</option></select>
  </div>

  <div id="appliance-options" class="option-list">
    <p class="muted">Choose a home to see its appliances.</p>
  </div>

  <div class="flow-actions">
    <button type="button" class="btn btn-secondary" id="btn-skip">Skip — not appliance-specific</button>
    <button type="button" class="btn btn-primary" id="btn-continue" disabled>Continue to booking</button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/select_appliance.js') }}"></script>
{% endblock %}
