{% extends "base.html" %}

{% block title %}Services{% endblock %}

{% block content %}
<section class="page-header">
  <h1>Services</h1>
  <p>Browse the services we offer and book one in a few steps.</p>
</section>

<div class="form-group">
  <label for="service-search">Search services</label>
  <input type="search" id="service-search" placeholder="Search by name or keyword">
</div>

<div class="filter-bar" id="category-filters" role="group" aria-label="Filter by category">
  <button type="button" class="chip is-active" data-category="">All</button>
</div>

<div id="services-message" class="alert" role="status" hidden></div>

<div class="card-grid" id="service-grid">
  <p class="muted">Loading services…</p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/services.js') }}"></script>
{% endblock %}
