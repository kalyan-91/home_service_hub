<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}HomeService OS{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/css/styles.css">
<script>document.documentElement.classList.add('js');</script>
{% block head %}{% endblock %}
</head>
<body>

<div class="top" id="top">
  <div class="wrap">
    <a class="brand" href="/">
      <span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span>
      <span>Home<b>Service</b> OS</span>
    </a>
    <button class="menu-toggle" id="menu-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="main-nav">
      <span></span><span></span><span></span>
    </button>
    <nav id="main-nav" aria-label="Main navigation">
      <a href="/services">Services</a>
      <a href="/technicians">Technicians</a>
      <a href="/bookings">Bookings</a>
      <a href="/customer">My account</a>
      <a href="/bookings/new?service_id=1">Book a service</a>
    </nav>
  </div>
</div>

{% block content %}{% endblock %}

<footer>
  <div class="wrap">
    <span>© HomeService OS · Better Services, Happier Homes</span>
  </div>
</footer>

{% block scripts %}{% endblock %}
</body>
</html>
