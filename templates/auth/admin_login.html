<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HomeService OS — Admin sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/css/admin_login.css">
</head>
<body class="al">

<main class="al-shell">
  <aside class="al-side">
    <a class="al-brand" href="/">
      <span class="al-logo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8M5 9.5V21h5v-6h4v6h5V9.5"/></svg></span>
      <span>Home<b>Service</b> OS</span>
    </a>
    <div class="al-side-copy">
      <h1>Run the platform from one place.</h1>
      <p>Verify technicians, follow bookings, resolve complaints and keep an eye on reviews.</p>
    </div>
    <p class="al-side-foot">Better Services, Happier Homes</p>
  </aside>

  <section class="al-panel">
    <form class="al-form" id="admin-login-form" novalidate>
      <h2>Admin sign in</h2>
      <p class="al-lead">Use your administrator account to continue.</p>

      <div class="al-alert" id="al-error" role="alert" hidden></div>

      <label for="al-email">Email</label>
      <input id="al-email" name="email" type="email" autocomplete="username" required placeholder="admin@example.com">

      <label for="al-password">Password</label>
      <div class="al-pw">
        <input id="al-password" name="password" type="password" autocomplete="current-password" required>
        <button type="button" id="al-toggle" class="al-toggle" aria-label="Show password" aria-pressed="false">Show</button>
      </div>

      <button class="al-submit" id="al-submit" type="submit">Sign in</button>

      <p class="al-back"><a href="/">Back to home</a></p>
    </form>
  </section>
</main>

<script src="/styles/js/admin_login.js"></script>
</body>
</html>
