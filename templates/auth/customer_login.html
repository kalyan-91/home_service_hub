{% extends "base.html" %}

{% block title %}Customer login{% endblock %}

{% block content %}
<section class="page-header">
  <h1 id="form-heading">Customer login</h1>
  <p id="form-sub">Log in to book services and track your jobs.</p>
</section>

<div id="auth-message" class="alert" role="status" hidden></div>

<div class="card" style="max-width:420px;">

  <form id="login-form">
    <div class="form-group">
      <label for="login-email">Email</label>
      <input type="email" id="login-email" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn btn-primary" id="btn-login">Log in</button>
  </form>

  <form id="register-form" hidden>
    <div class="form-group">
      <label for="reg-name">Full name</label>
      <input type="text" id="reg-name" autocomplete="name" required>
    </div>
    <div class="form-group">
      <label for="reg-email">Email</label>
      <input type="email" id="reg-email" autocomplete="email" required>
    </div>
    <div class="form-group">
      <label for="reg-phone">Phone number</label>
      <input type="tel" id="reg-phone" autocomplete="tel" required>
    </div>
    <div class="form-group">
      <label for="reg-password">Password</label>
      <input type="password" id="reg-password" autocomplete="new-password" required minlength="6">
    </div>
    <button type="submit" class="btn btn-primary" id="btn-register">Create account</button>
  </form>

  <p class="muted" style="margin-top:16px;">
    <button type="button" class="link-button" id="toggle-mode">New here? Create an account</button>
  </p>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script>const AUTH_ROLE = 'customer'; const AUTH_AFTER_LOGIN = '/customer';</script>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
